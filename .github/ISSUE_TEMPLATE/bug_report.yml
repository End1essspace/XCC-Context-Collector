name: Bug report
description: Report a reproducible XCC defect or regression.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an XCC issue.

        Remove credentials, private source, confidential Git diffs, usernames, and absolute private paths before submitting. Do not paste generated XCC context unless every line is intentionally public. See `docs/BUG_REPORTING.md` and `SECURITY.md`.

  - type: input
    id: version
    attributes:
      label: XCC version
      description: Copy the version from About, VERSION.txt, or `python -c "import xcc; print(xcc.__version__)"`.
      placeholder: "1.2.0"
    validations:
      required: true

  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - Packaged portable ZIP
        - Source checkout / editable install
        - Other
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version, build, and architecture
      placeholder: "Windows 11 24H2, build 26100, x64"
    validations:
      required: true

  - type: input
    id: display
    attributes:
      label: Display scale and monitor setup
      description: Required for layout, icon, DPI, or multi-monitor defects.
      placeholder: "150%, 2560x1440 primary monitor"

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Selected Files
        - Full Folder
        - Git Changed Files
        - Project Tree
        - Output formatting or character budget
        - Safety confirmation or warnings
        - Runtime history or result metrics
        - GUI layout or navigation
        - Tray, hotkey, autostart, or single instance
        - Settings or config recovery
        - Build, portable ZIP, or release tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence using sanitized names and paths.
      placeholder: |
        1. Start XCC v1.2.0
        2. Select Full Folder
        3. Choose a sanitized test project
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the XCC outcome and visible warning/error counts when relevant.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only the relevant final error block, relative paths, counts, outcome, or CI/build output. Never paste secrets or collected context.
      render: text

  - type: textarea
    id: visual
    attributes:
      label: Sanitized screenshot or recording
      description: Drag and drop visual evidence for GUI, tray, icon, or DPI issues. Remove private paths and project content first.

  - type: checkboxes
    id: safety
    attributes:
      label: Submission checks
      options:
        - label: I removed credentials, tokens, private keys, connection strings, and detected values.
          required: true
        - label: I removed private paths, proprietary source, and confidential Git diffs.
          required: true
        - label: I checked existing issues for duplicates.
          required: true
        - label: This is not a private security vulnerability requiring a GitHub security advisory.
          required: true
