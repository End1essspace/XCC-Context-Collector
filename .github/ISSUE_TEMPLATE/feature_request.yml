name: Feature request
description: Propose a focused improvement to XCC.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow problem first. Keep requests within the supported PySide6 product boundary and do not attach private project content.

  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: Explain what is difficult, repetitive, unsafe, or unclear in the current XCC workflow.
      placeholder: "When I use ..., I cannot ... because ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected user-visible behavior, including relevant states and failure handling.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Collection and scanning
        - Git context
        - Output formatting and character budget
        - Ignore rules and context safety
        - Result health and runtime history
        - GUI and navigation
        - Tray, hotkey, autostart, or single instance
        - Packaging and releases
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Primary benefit
      options:
        - Reliability or data integrity
        - Safety or privacy visibility
        - Performance or responsiveness
        - Workflow speed
        - Windows integration
        - Distribution or maintenance
        - Accessibility or usability
        - Other
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Example workflow
      description: Use sanitized filenames and paths. Do not attach real collected context.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or smaller-scope options.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This request targets the supported PySide6 desktop application.
          required: true
        - label: This request does not require posting private project content or credentials.
          required: true
        - label: I checked the roadmap and existing issues for related work.
          required: true
